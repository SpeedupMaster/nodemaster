services:
  nodemaster:
    image: ghcr.io/speedupmaster/nodemaster:latest
    container_name: nodemaster
    restart: unless-stopped
    ports:
      - "3880:3880"
    environment:
      - PORT=3880
      - HOST=0.0.0.0
      # - NODEMASTER_ADMIN_PASSWORD=YourStrongPasswordHere
      # Behind nginx/Caddy: trust the proxy so client IP and https are detected correctly
      # - TRUST_PROXY=1
    # Only runtime data is mounted; installer scripts ship inside the image (/app/server/assets).
    volumes:
      - ./data:/app/server/data
