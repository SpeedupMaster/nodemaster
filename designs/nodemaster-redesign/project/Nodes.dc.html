<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>NodeMaster · 节点管理</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0D10}
a{color:#6EA8FE;text-decoration:none}a:hover{color:#9CC3FF}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.card{background:#12151A;border:1px solid #232831;border-radius:12px}
.btn{height:36px;padding:0 14px;border-radius:8px;border:1px solid #2E343E;background:#161A20;color:#E6E9EE;font-family:inherit;font-size:13px;font-weight:500;line-height:1;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.btn-primary{background:#6EA8FE;border-color:#6EA8FE;color:#0B0D10;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500}
.bar{height:4px;border-radius:2px;background:#232831;overflow:hidden}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 100vh; background: #0B0D10; color: #E6E9EE; font-family: 'Inter','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <dc-import name="Sidebar" active="nodes" hint-size="232px,100%"></dc-import>

  <main style="flex: 999 1 560px; min-width: 0; padding: 28px 32px 48px; display: flex; flex-direction: column; gap: 20px; box-sizing: border-box; max-width: 1440px">
    <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end">
      <div style="display: flex; flex-direction: column; gap: 6px; flex: 1 1 360px">
        <h1 style="margin: 0; font-size: 24px; font-weight: 700">节点</h1>
        <p style="margin: 0; font-size: 14px; color: #A3ABB7">9 台 VPS · 6 台主力直连 · 2 台解锁落地 · 1 台仅探针</p>
      </div>
      <button class="btn">Xray 内核版本</button>
      <a class="btn btn-primary" href="Deploy.dc.html" style="color: #0B0D10"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>接入节点</a>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center">
      <div role="group" aria-label="节点类型" style="display: flex; padding: 3px; gap: 2px; border: 1px solid #232831; border-radius: 9px; background: #12151A; flex-wrap: wrap">
        <sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
          <button onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}<span class="mono" style="margin-left: 6px; color: #848D9A">{{f.n}}</span></button>
        </sc-for>
      </div>
      <label style="margin-left: auto; flex: 0 1 300px; height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid #232831; border-radius: 8px; background: #12151A; color: #848D9A">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input aria-label="搜索节点" placeholder="名称、IP 或标签" style="flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #E6E9EE; font: inherit; font-size: 13px">
      </label>
      <div role="group" aria-label="视图" style="display: flex; border: 1px solid #232831; border-radius: 8px; overflow: hidden">
        <button aria-label="卡片视图" style="width: 36px; height: 34px; border: 0; background: #232A35; color: #E6E9EE; cursor: pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"></path></svg></button>
        <button aria-label="表格视图" style="width: 36px; height: 34px; border: 0; background: #12151A; color: #A3ABB7; cursor: pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px">
      <sc-for list="{{nodes}}" as="n" hint-placeholder-count="9">
        <article class="card" style="display: flex; flex-direction: column; border-color: {{n.border}}">
          <div style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 10px">
            <div style="display: flex; align-items: flex-start; gap: 10px">
              <span class="mono" style="width: 30px; height: 22px; border-radius: 5px; background: #1C2129; color: #A3ABB7; font-size: 11px; display: flex; align-items: center; justify-content: center; flex: none; margin-top: 1px">{{n.cc}}</span>
              <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1">
                <a href="NodeDetail.dc.html" style="color: #E6E9EE; font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{n.name}}</a>
                <span class="mono" style="font-size: 11.5px; color: #848D9A">{{n.ip}}</span>
              </div>
              <span class="chip" style="background: {{n.stBg}}; color: {{n.stFg}}; flex: none"><span style="width: 6px; height: 6px; border-radius: 50%; background: {{n.stFg}}"></span>{{n.st}}</span>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 6px">
              <span class="chip" style="background: {{n.roleBg}}; color: {{n.roleFg}}">{{n.role}}</span>
              <span class="chip mono" style="background: #181C22; color: #A3ABB7">{{n.proto}}</span>
              <span class="chip mono" style="background: #181C22; color: #A3ABB7">{{n.bw}}</span>
              <span class="chip" style="background: #181C22; color: #A3ABB7">{{n.tags}}</span>
            </div>
          </div>
          <div style="margin: 14px 16px 0; padding: 12px; border-radius: 8px; background: #0F1216; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
            <div style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 11.5px; color: #848D9A">下行</span><span class="mono" style="font-size: 14px">{{n.down}}</span></div>
            <div style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 11.5px; color: #848D9A">上行</span><span class="mono" style="font-size: 14px">{{n.up}}</span></div>
            <div style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 11.5px; color: #848D9A">延迟</span><span class="mono" style="font-size: 14px; color: {{n.latColor}}">{{n.lat}}</span></div>
          </div>
          <div style="padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
            <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
              <div style="display: flex; flex-direction: column; gap: 5px"><div style="display: flex; justify-content: space-between; font-size: 12px"><span style="color: #848D9A">CPU</span><span class="mono">{{n.cpu}}</span></div><div class="bar"><div style="height: 100%; width: {{n.cpu}}; background: #6EA8FE"></div></div></div>
              <div style="display: flex; flex-direction: column; gap: 5px"><div style="display: flex; justify-content: space-between; font-size: 12px"><span style="color: #848D9A">内存</span><span class="mono">{{n.mem}}</span></div><div class="bar"><div style="height: 100%; width: {{n.mem}}; background: #A58BFA"></div></div></div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 5px"><div style="display: flex; justify-content: space-between; font-size: 12px"><span style="color: #848D9A">本月流量</span><span class="mono" style="color: {{n.qColor}}">{{n.quota}}</span></div><div class="bar"><div style="height: 100%; width: {{n.qPct}}; background: {{n.qColor}}"></div></div></div>
          </div>
          <div style="margin-top: auto; padding: 10px 12px 10px 16px; border-top: 1px solid #1C2027; display: flex; align-items: center; gap: 6px">
            <span style="font-size: 12px; color: #848D9A; flex: 1">{{n.bill}}</span>
            <button class="btn" style="height: 30px; padding: 0 10px; font-size: 12.5px">复制链接</button>
            <button class="btn" style="height: 30px; padding: 0 10px; font-size: 12.5px">配置</button>
            <button class="btn" aria-label="更多操作" style="height: 30px; width: 30px; padding: 0; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg></button>
          </div>
        </article>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1400}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { f: '全部' }; }
  renderVals() {
    const seg = (on) => 'height:30px;padding:0 12px;border:0;border-radius:6px;cursor:pointer;font-family:inherit;font-size:13px;' + (on ? 'background:#232A35;color:#E6E9EE;font-weight:600;' : 'background:transparent;color:#A3ABB7;');
    const ok = { st: '在线', stBg: '#11241C', stFg: '#3ECF8E', border: '#232831' };
    const direct = { role: '主力直连', roleBg: '#1A2232', roleFg: '#9CC3FF' };
    const land = { role: '解锁落地', roleBg: '#1D1A2B', roleFg: '#C9B8FF' };
    const probe = { role: '仅探针', roleBg: '#181C22', roleFg: '#A3ABB7' };
    const all = [
      ['HK', '香港 CN2 GIA · 极速专线', '45.154.12.88:443', ok, direct, 'Reality', '1 Gbps', 'CN2 GIA · 4K', 23.4, 41.2, '21.6 MB/s', '4.8 MB/s', 18, 4935.7, 10240, '¥168/月 · 66 天后到期'],
      ['JP', '东京 BGP · 软银金融专线', '103.214.88.25:443', ok, direct, 'Reality', '1 Gbps', '软银 · 低抖动', 17.8, 35.6, '11.2 MB/s', '2.3 MB/s', 36, 2805.8, 6144, '¥120/月 · 25 天后到期'],
      ['SG', '新加坡 · 亚太骨干枢纽', '139.180.201.76:8443', ok, direct, 'Reality', '2.5 Gbps', '亚太骨干', 31.2, 53.4, '28.4 MB/s', '6.2 MB/s', 52, 4003.8, 8192, '¥220/月 · 140 天后到期'],
      ['US', '洛杉矶 AS9929 · 美西优化', '23.94.108.19:443', ok, direct, 'Reality', '1 Gbps', 'AS9929 · 高防', 22.4, 38.8, '15.6 MB/s', '3.8 MB/s', 132, 8622.1, 15360, '$99/年 · 67 天后到期'],
      ['DE', '法兰克福 · 欧洲核心互联', '185.242.115.42:443', ok, direct, 'Reality', '1 Gbps', 'DE-CIX', 12.5, 28.3, '3.8 MB/s', '921 KB/s', 168, 1884.2, 10240, '€48/年 · 216 天后到期'],
      ['KR', '首尔 · 低延迟游戏专线', '211.234.118.50:443', { st: '已熔断', stBg: '#2A1618', stFg: '#F26D6D', border: '#4A2326' }, direct, 'Reality', '1 Gbps', '游戏加速', 0.8, 9.1, '0 B/s', '0 B/s', 42, 3072, 3072, '流量已耗尽 · 12 月 1 日恢复'],
      ['SG', '狮城原生 · 4K 流媒体解锁', '165.22.98.140:8388', ok, land, 'SS 2022', '500 Mbps', '原生 IP · 双栈', 15.6, 24.3, '7.2 MB/s', '1.4 MB/s', 58, 780.0, 3072, '$45/月 · 50 天后到期'],
      ['US', '硅谷原生 · AI 服务住宅', '142.250.72.68:8388', ok, land, 'SS 2022', '500 Mbps', '住宅 IP', 14.8, 22.0, '4.8 MB/s', '1.1 MB/s', 142, 1177.6, 4096, '$60/月 · 112 天后到期'],
      ['CN', '北京 BGP · 遥测探针站', '仅探针 · 无代理端口', ok, probe, '探针', '100 Mbps', '遥测', 6.2, 18.4, '0.4 MB/s', '0.1 MB/s', null, 23.9, 1024, '自有机房']
    ];
    const roleOf = { '主力直连': '主力直连', '解锁落地': '解锁落地', '仅探针': '仅探针' };
    const f = this.state.f;
    const nodes = all.filter((r) => f === '全部' || (f === '已熔断' ? r[3].st === '已熔断' : r[4].role === roleOf[f])).map((r) => {
      const p = r[13] / r[14] * 100;
      const qColor = p >= 100 ? '#F26D6D' : p > 80 ? '#F0B341' : '#6EA8FE';
      return Object.assign({ cc: r[0], name: r[1], ip: r[2], proto: r[5], bw: r[6], tags: r[7], cpu: r[8] + '%', mem: r[9] + '%', down: r[10], up: r[11],
        lat: r[12] === null ? '—' : r[12] + ' ms', latColor: r[12] === null ? '#848D9A' : r[12] < 60 ? '#3ECF8E' : r[12] < 150 ? '#F0B341' : '#F26D6D',
        quota: r[13] + ' / ' + r[14] + ' GB', qPct: Math.min(p, 100).toFixed(1) + '%', qColor, bill: r[15] }, r[3], r[4]);
    });
    return {
      filters: [['全部', 9], ['主力直连', 6], ['解锁落地', 2], ['仅探针', 1], ['已熔断', 1]].map(([label, n]) => ({ label, n, style: seg(f === label), pick: () => this.setState({ f: label }) })),
      nodes
    };
  }
}
</script>
</body>
</html>
