<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>侧边导航</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<aside aria-label="主导航" style="width: 232px; min-height: 100%; box-sizing: border-box; background: #0B0D10; border-right: 1px solid #232831; display: flex; flex-direction: column; font-family: 'Inter','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; color: #E6E9EE">
  <div style="display: flex; align-items: center; gap: 10px; padding: 20px 20px 18px">
    <div style="width: 30px; height: 30px; border-radius: 8px; background: #6EA8FE; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B0D10" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="12" r="2.5"></circle><circle cx="18" cy="6" r="2.5"></circle><circle cx="18" cy="18" r="2.5"></circle><path d="M8.2 10.9l7.6-3.8M8.2 13.1l7.6 3.8"></path></svg>
    </div>
    <div style="display: flex; flex-direction: column">
      <span style="font-size: 15px; font-weight: 700; letter-spacing: -0.01em">NodeMaster</span>
      <span style="font-size: 11px; color: #848D9A; font-family: 'JetBrains Mono',monospace">v1.0 · 控制面板</span>
    </div>
  </div>

  <nav style="display: flex; flex-direction: column; gap: 18px; padding: 6px 12px; flex: 1">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <sc-if value="{{g.label}}" hint-placeholder-val="{{ true }}">
          <span style="padding: 0 10px 6px; font-size: 11px; font-weight: 600; color: #848D9A; letter-spacing: 0.06em">{{g.label}}</span>
        </sc-if>
        <sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
          <a href="{{it.href}}" aria-current="{{it.current}}" style="{{it.style}}">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.d}}"></path></svg>
            <span style="flex: 1">{{it.label}}</span>
            <sc-if value="{{it.badge}}" hint-placeholder-val="{{ false }}">
              <span style="font-family: 'JetBrains Mono',monospace; font-size: 11px; padding: 1px 6px; border-radius: 5px; background: #2A2113; color: #F0B341">{{it.badge}}</span>
            </sc-if>
          </a>
        </sc-for>
      </div>
    </sc-for>
  </nav>

  <div style="margin: 12px; padding: 12px; border: 1px solid #232831; border-radius: 10px; background: #12151A; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #A3ABB7">
      <span style="width: 7px; height: 7px; border-radius: 50%; background: #3ECF8E"></span>
      <span>实时通道已连接</span>
      <span style="margin-left: auto; font-family: 'JetBrains Mono',monospace; color: #848D9A">WS</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="width: 30px; height: 30px; border-radius: 50%; background: #1E2633; color: #6EA8FE; font-weight: 600; font-size: 13px; display: flex; align-items: center; justify-content: center">A</span>
      <div style="display: flex; flex-direction: column; flex: 1">
        <span style="font-size: 13px; font-weight: 600">admin</span>
        <span style="font-size: 11px; color: #848D9A">管理员</span>
      </div>
      <a href="Login.dc.html" aria-label="退出登录" style="width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #A3ABB7">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"></path></svg>
      </a>
    </div>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dashboard","nodes","traffic","latency","topology","subscription","deploy","alerts"],"default":"dashboard"},"$preview":{"width":232,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'dashboard';
    const base = 'display:flex;align-items:center;gap:10px;padding:0 10px;height:36px;border-radius:8px;font-size:13.5px;text-decoration:none;';
    const mk = (id, label, href, d, badge) => {
      const on = id === active;
      return {
        label, href, d, badge: badge || '',
        current: on ? 'page' : 'false',
        style: base + (on ? 'background:#1A2232;color:#E6E9EE;font-weight:600;box-shadow:inset 2px 0 0 #6EA8FE;' : 'color:#A3ABB7;font-weight:500;')
      };
    };
    return {
      groups: [
        { label: '', items: [
          mk('dashboard', '概览', 'Main.dc.html', 'M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z'),
          mk('nodes', '节点', 'Nodes.dc.html', 'M4 4h16v6H4zM4 14h16v6H4zM8 7h.01M8 17h.01', '8/9')
        ]},
        { label: '网络', items: [
          mk('traffic', '流量统计', 'Traffic.dc.html', 'M5 20V11M12 20V4M19 20v-6'),
          mk('latency', '延迟监测', 'Latency.dc.html', 'M3 12h4l3-8 4 16 3-8h4'),
          mk('topology', '链式拓扑', 'Topology.dc.html', 'M4 4h5v5H4zM15 15h5v5h-5zM15 4h5v5h-5zM9 6.5h6M17.5 9v6')
        ]},
        { label: '分发', items: [
          mk('subscription', '订阅与导出', 'Subscription.dc.html', 'M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1')
        ]},
        { label: '运维', items: [
          mk('deploy', '接入节点', 'Deploy.dc.html', 'M4 5h16v14H4zM8 10l3 2-3 2M13 15h4'),
          mk('alerts', '告警中心', 'Alerts.dc.html', 'M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4')
        ]}
      ]
    };
  }
}
</script>
</body>
</html>
